plugins {
    id 'com.android.application'
}

final boolean dora64Runtime = (project.findProperty('dora64Runtime') ?: 'false').toString().toBoolean()
final File generatedAssetsDir = layout.buildDirectory.dir('generated/dora64Assets').get().asFile

// Private signing material stays outside the repository and APK.
final Properties releaseSigning = new Properties()
final String signingPath = System.getenv('DORA64_SIGNING_PROPERTIES')
if (signingPath) {
    file(signingPath).withInputStream { releaseSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each {
        if (!releaseSigning.getProperty(it)) {
            throw new GradleException("Missing release signing property: ${it}")
        }
    }
}

android {
    namespace 'com.n64recomp.dora64'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.n64recomp.dora64'
        minSdk 24
        targetSdk 36
        versionCode 35
        versionName '1.0'
        buildConfigField 'boolean', 'DORA64_RUNTIME', dora64Runtime ? 'true' : 'false'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                targets dora64Runtime ? 'Dora64' : 'main'
                arguments "-DDORA64_HOST_FILE_TO_C=${System.getenv('DORA64_HOST_FILE_TO_C') ?: ''}"
            }
        }
    }

    // Gameplay/performance builds must optimize the generated game, RT64,
    // and runtime together. Keep native symbols locally for crash analysis.
    // The debug signing key allows installing this variant over test builds.
    signingConfigs {
        if (signingPath) {
            production {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (signingPath) signingConfig signingConfigs.production
            debuggable false
            jniDebuggable false
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        optimized {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            minifyEnabled false
            matchingFallbacks = ['release']
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
    }

    ndkVersion '27.0.12077973'

    externalNativeBuild {
        cmake {
            path file(dora64Runtime ? '../../CMakeLists.txt' : 'CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../../lib/SDL2/android-project/app/src/main/java']
            res.srcDirs += ['../../lib/SDL2/android-project/app/src/main/res']
            if (dora64Runtime) {
                assets.srcDirs += [generatedAssetsDir]
            }
        }
    }
}

if (dora64Runtime) {
    tasks.register('copyDora64Assets', Sync) {
        from('../../assets') {
            include 'icons/**'
            include 'localization/dialogue_font.bmp', 'localization/dialogue_font.json'
            include 'localization/languages.json'
            include 'localization/dialogue_index.json', 'localization/game_text_index.json'
            include 'localization/en/**', 'localization/ru/**'
            exclude '**/*_source.json'
            into 'dora64/assets'
        }
        into generatedAssetsDir
    }
    tasks.named('preBuild') {
        dependsOn tasks.named('copyDora64Assets')
    }
}
